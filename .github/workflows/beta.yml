name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Beta
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selected Xcode: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi

      - name: Neutralize LicensePlist & Fix Duplicates
        run: |
          # 1. تفريغ إعدادات الرخص
          find . -name "license_plist.yml" -exec sh -c '> "$1"' _ {} \; 2>/dev/null || true

          # 2. إنشاء ملف LICENSE_LC في مسار Zsign
          mkdir -p Zsign
          touch Zsign/LICENSE_LC

          # 3. تخطي تشغيل أداة الرخص بنجاح دائم
          mkdir -p "$HOME/bin"
          cat << 'EOF' > "$HOME/bin/license-plist"
          #!/bin/bash
          exit 0
          EOF
          chmod +x "$HOME/bin/license-plist"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          # تمرير متغيرات تعطيل فحص تكرار الملفات وقيود الإضافات إلى xcodebuild
          make OTHER_CODE_SIGN_FLAGS="--disablePackagePluginSandbox" \
               XCODE_FLAGS="ENABLE_DUPLICATE_FILE_PATH_RECORD=NO OTHER_SWIFT_FLAGS='-no-verify-emitted-module-interface'" \
               || make ENABLE_DUPLICATE_FILE_PATH_RECORD=NO

      - name: Update Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_OFFICIAL_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "## Commit: \`$COMMIT_MSG\` (${{ github.sha }})" >> release_notes.md
          echo "### New in this build (Compared to $LATEST_OFFICIAL_TAG):" >> release_notes.md
            
          CHANGES=$(git log --pretty=format:"* %s (%h)" ${LATEST_OFFICIAL_TAG}..HEAD)
            
          if [ -z "$CHANGES" ]; then
            echo "* No code changes since $LATEST_OFFICIAL_TAG" >> release_notes.md
          else
            echo "$CHANGES" >> release_notes.md
          fi
          
          echo "### Commit SHA: ${{ github.sha }}" >> release_notes.md
          
          cat release_notes.md

          gh release delete beta --cleanup-tag -y || true
          
          gh release create beta "packages/Ksign.ipa" \
            --title "Latest Beta Build" \
            --notes "$(cat release_notes.md)" \
            --prerelease \
            --target ${{ github.sha }}

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          REPO="${{ github.repository }}"
          TAG="beta"
          FILENAME="Ksign.ipa"
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$FILENAME"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          
          jq -n \
            --arg commit_msg "$COMMIT_MSG" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg release_url "$RELEASE_URL" \
            '{content: "**New Beta Released!**\n\nChanges: `\($commit_msg)`\n\n[**Download IPA**](\($download_url))\n[View Release](\($release_url))"}' > discord_payload.json

          curl -v \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK"
