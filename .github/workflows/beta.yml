name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Beta
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode 16
        run: |
          # اختيار أحدث إصدار متوفر من Xcode 16 على بيئة البناء
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selected Xcode: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "Using default Xcode"
          fi

      - name: Setup Xcodebuild Destination Shim
        run: |
          # إنشاء غلاف لأمر xcodebuild لإجبار تحديد وجهة بناء iOS لأي أمر ينفذه make
          mkdir -p "$HOME/bin"
          REAL_XCODEBUILD=$(xcrun -f xcodebuild)
          cat << 'EOF' > "$HOME/bin/xcodebuild"
          #!/bin/bash
          ARGS=("$@")
          HAS_DEST=0
          for arg in "$@"; do
            if [ "$arg" = "-destination" ]; then
              HAS_DEST=1
              break
            fi
          done

          if [ $HAS_DEST -eq 0 ]; then
            exec "$REAL_XCODEBUILD_PATH" "${ARGS[@]}" -destination "generic/platform=iOS"
          else
            exec "$REAL_XCODEBUILD_PATH" "${ARGS[@]}"
          fi
          EOF

          chmod +x "$HOME/bin/xcodebuild"
          echo "REAL_XCODEBUILD_PATH=$REAL_XCODEBUILD" >> $GITHUB_ENV
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          # تعطيل قيود الـ Sandbox لإضافات Xcode وتشغيل البناء
          make OTHER_CODE_SIGN_FLAGS="--disablePackagePluginSandbox" || make

      - name: Update Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_OFFICIAL_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "## Commit: \`$COMMIT_MSG\` (${{ github.sha }})" >> release_notes.md
          echo "### New in this build (Compared to $LATEST_OFFICIAL_TAG):" >> release_notes.md
            
          CHANGES=$(git log --pretty=format:"* %s (%h)" ${LATEST_OFFICIAL_TAG}..HEAD)
            
          if [ -z "$CHANGES" ]; then
            echo "* No code changes since $LATEST_OFFICIAL_TAG" >> release_notes.md
          else
            echo "$CHANGES" >> release_notes.md
          fi
          
          echo "### Commit SHA: ${{ github.sha }}" >> release_notes.md
          
          cat release_notes.md

          gh release delete beta --cleanup-tag -y || true
          
          gh release create beta "packages/Ksign.ipa" \
            --title "Latest Beta Build" \
            --notes "$(cat release_notes.md)" \
            --prerelease \
            --target ${{ github.sha }}

      - name: Notify Discord
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          REPO="${{ github.repository }}"
          TAG="beta"
          FILENAME="Ksign.ipa"
          
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$FILENAME"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          
          echo "Sending link to Discord..."
          
          jq -n \
            --arg commit_msg "$COMMIT_MSG" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg release_url "$RELEASE_URL" \
            '{content: "**New Beta Released!**\n\nChanges: `\($commit_msg)`\n\n[**Download IPA**](\($download_url))\n[View Release](\($release_url))"}' > discord_payload.json

          curl -v \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK"
